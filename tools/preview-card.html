<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stonks preview.png</title>
<!-- Stonks' preview.png, the README's first picture and the plugin
     marketplace's: 1600 x 800, shot at twice the scale by
     tools/render-preview.sh, drawn to read at the marketplace card's 350 px.
     The bar across the top with Stonks' pill over the panel it opens, the
     bull, the wordmark and what Stonks is beside it. The two pictures under
     /grabs/ are Stonks' own, from test/qml/readme.sh --marketplace: the pill on
     its strip at scale 6 and the retro panel at scale 3, each shown at half
     its pixels, so each of their pixels is one of the shot's. -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  html, body { margin: 0; width: 1600px; height: 800px; overflow: hidden; }
  body { position: relative; background: #0e0e14; }
  .scatter { position: absolute; inset: 0; width: 1600px; height: 800px; }
  .grab { position: absolute; overflow: hidden; }
  .grab img { display: block; }
  .fade::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: linear-gradient(transparent, #0e0e14); }
  .shadow { box-shadow: 14px 14px 0 rgba(0, 0, 0, 0.35); }
  .say { font: 800 56px/1.18 var(--mono); color: var(--fg); margin: 0; letter-spacing: -0.01em; }
  .facts { font: 400 30px/1.4 var(--mono); color: var(--text); margin: 0; letter-spacing: 0.02em; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 80px; background: #1a1b26; border-bottom: 2px solid #2f334d; }
  .ws { position: absolute; left: 110px; top: 0; height: 78px; display: flex; align-items: center; gap: 26px; font: 700 34px var(--mono); }
  .ws b { color: #c0caf5; }
  .ws i { font-style: normal; color: #565f89; }
</style>
</head>
<body>
<canvas class="scatter"></canvas>
<div class="bar"></div>
<div class="ws"><b>1</b><i>2</i><i>3</i><i>4</i></div>
<div class="grab" style="left:470px; top:0; width:1440px; height:78px"><img src="/grabs/strip.png" alt=""></div>
<img src="../img/bull.svg" style="position:absolute; left:110px; top:180px; width:160px; height:104px; image-rendering:pixelated" alt="">
<div class="wordmark" style="position:absolute; left:110px; top:330px"></div>
<p class="say" style="position:absolute; left:110px; top:470px; width:640px">Stocks in your<br>Omarchy bar.</p>
<p class="facts" style="position:absolute; left:110px; top:630px">Free · No account · No API key</p>
<div class="grab fade shadow" style="left:830px; top:104px; width:720px; height:696px"><img src="/grabs/popup.png" alt=""></div>

<script src="../cells.js"></script>
<script>
  // Each grab at half its pixels: the shot is at twice the scale.
  for (const img of document.querySelectorAll(".grab img")) {
    const half = () => { img.width = img.naturalWidth / 2; img.height = img.naturalHeight / 2; };
    if (img.complete) half(); else img.addEventListener("load", half);
  }
  const { COL } = Cells;
  document.querySelector(".wordmark").innerHTML = Cells.blocksSVG("STONKS", 18, COL.fg, 5, 0.06);
  const sc = Cells.fit(document.querySelector(".scatter"));
  let seed = 5;
  const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let y = 0; y < 800; y += 26) for (let x = 0; x < 1600; x += 26) {
    const edge = Math.abs(x / 1600 - 0.5) * 2;
    if (r() < Math.pow(edge, 5) * 0.6) { sc.ctx.fillStyle = Cells.rgba(COL.accent, 0.05 + r() * 0.1); sc.ctx.fillRect(x, y, 14, 14); }
  }
</script>
</body>
</html>
